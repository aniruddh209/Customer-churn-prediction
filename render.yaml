services:
  # 1. Backend Flask API Web Service
  - type: web
    name: churniq-backend
    env: python
    region: singapore
    rootDir: CCP/backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14

staticSites:
  # 2. Frontend React Application Static Site
  - name: churniq-frontend
    region: singapore
    rootDir: CCP/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
